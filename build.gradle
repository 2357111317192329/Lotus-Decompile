plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.+'
}
base {
    archivesName = project.archives_base_name
}
version = project.mod_version
minecraft_version = project.minecraft_version
group = project.maven_group

repositories {
    maven {url = "https://masa.dy.fi/maven/sakura-ryoko"
	content {includeGroupAndSubgroups("fi.dy.masa")}
    }
    maven {url = 'https://maven.fallenbreath.me/releases'
	content {includeGroupAndSubgroups("me.fallenbreath")}
    }
    maven {
        name = "Meteor Dev Releases"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "Meteor Dev Snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
    maven { url = 'https://jitpack.io' }
}

loom {
        accessWidenerPath = file("src/main/resources/xiaohe66-meteor-lotus.accesswidener")
}

dependencies {
	// Fabric
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

        // Meteor
        implementation "meteordevelopment:meteor-client:${project.meteor_version}"
        
        implementation "com.github.sakura-ryoko:malilib:${project.malilib_version}"

        implementation "com.github.sakura-ryoko:litematica:${project.litematica_version}"
        //compileOnly
        implementation "meteordevelopment:baritone:${project.baritone_version}"
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

processResources {
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
            "mc_version": project.property("minecraft_version")
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding("UTF-8")
}